<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevate — Book your demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #FFFFFF; color: #0B1220; font-family: 'Inter', system-ui, sans-serif; }
p { margin: 0; }
a { color: #5B6678; }
a:hover { color: #0B1220; }

header { display: flex; justify-content: center; padding: 22px 16px; background: #0B1220; color: #FFFFFF; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand span { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.14em; }

main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: clamp(24px, 3vw, 40px); padding: clamp(28px, 4vw, 48px) clamp(16px, 4vw, 48px) clamp(40px, 5vw, 72px); }
.intro { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #0B6B4A; }
h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: clamp(24px, 3vw, 34px); line-height: 1.2; }
h1 strong { font-weight: 700; }

.calendar { width: 100%; max-width: 1060px; min-height: 640px; border: 1px solid #E2E8F0; border-radius: 12px; box-shadow: 0 1px 3px rgba(11, 18, 32, 0.06); overflow: hidden; }

footer { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 8px clamp(16px, 4vw, 48px) 48px; text-align: center; font-size: 15px; color: #3A4556; }
footer .links { color: #5B6678; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6EE7B7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14l8-8 8 8"/><path d="M4 20l8-8 8 8"/></svg>
    <span>ELEVATE</span>
  </div>
</header>

<main>
  <div class="intro">
    <p class="eyebrow" id="eyebrow">You qualify</p>
    <h1><strong>Next Step:</strong> Book Your Demo Below</h1>
  </div>

  <section class="calendar" aria-label="Booking calendar">
    <iframe data-src="https://api.leadconnectorhq.com/widget/booking/lpdw3HOjX5UJkpo6A5Q7" title="Book your demo" allow="payment" style="display: block; width: 100%; min-height: 640px; border: none; overflow: hidden;" scrolling="no" id="lpdw3HOjX5UJkpo6A5Q7_1794861754919"></iframe>
    <script>
    (function () {
      // Loads the booking widget, pre-filled with the contact details given in the survey.
      var frame = document.getElementById('lpdw3HOjX5UJkpo6A5Q7_1794861754919');
      var url = frame.getAttribute('data-src');
      try {
        var data = JSON.parse(sessionStorage.getItem('elevateSurvey') || 'null') || {};
        var phone = String(data.phone || '').replace(/\D/g, '');
        if (phone.length === 10) phone = '+1' + phone;
        else if (phone.length === 11 && phone.charAt(0) === '1') phone = '+' + phone;
        var fields = { first_name: data.firstName, last_name: data.lastName, email: data.email, phone: phone };
        var query = Object.keys(fields)
          .filter(function (k) { return typeof fields[k] === 'string' && fields[k].trim(); })
          .map(function (k) { return k + '=' + encodeURIComponent(fields[k].trim()); })
          .join('&');
        if (query) url += '?' + query;
      } catch (e) {}
      frame.src = url;
    })();
    </script>
  </section>
  <script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript"></script>
</main>

<footer>
  <p class="links"><a href="#terms">Terms &amp; Conditions</a> | <a href="#privacy">Privacy Policy</a></p>
  <p>Copyright 2026 Elevate. All rights reserved.</p>
  <p>This website is operated and maintained by [YOUR LEGAL ENTITY]. Use of the website is governed by its Terms of Service and Privacy Policy.</p>
</footer>

<script>
(function () {
  // Greets the visitor by first name when the survey answers are available in this tab.
  try {
    var data = JSON.parse(sessionStorage.getItem('elevateSurvey') || 'null');
    var first = data && typeof data.firstName === 'string' ? data.firstName.trim() : '';
    if (first) document.getElementById('eyebrow').textContent = 'You qualify, ' + first;
  } catch (e) {}
})();
</script>
<script>
(function () {
  // Diagnostic mode: open /calendar/?debug=1 to list every message the booking
  // widget sends to this page. Nothing is shown or recorded without ?debug=1.
  if (new URLSearchParams(window.location.search).get('debug') !== '1') return;
  var lines = [];
  var panel = document.createElement('div');
  panel.setAttribute('style', 'position:fixed;left:0;right:0;bottom:0;z-index:9999;max-height:45vh;display:flex;flex-direction:column;background:#0B1220;color:#E6ECF5;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;border-top:2px solid #6EE7B7');
  var bar = document.createElement('div');
  bar.setAttribute('style', 'display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border-bottom:1px solid #1C2740');
  var title = document.createElement('strong');
  title.textContent = 'Diagnostic: 0 message(s) from the calendar';
  var copy = document.createElement('button');
  copy.type = 'button';
  copy.textContent = 'Copy all';
  copy.setAttribute('style', 'min-height:36px;padding:0 14px;font:inherit;font-weight:600;color:#0B1220;background:#6EE7B7;border:none;border-radius:6px;cursor:pointer');
  var log = document.createElement('pre');
  log.setAttribute('style', 'margin:0;padding:10px 12px;overflow:auto;white-space:pre-wrap;word-break:break-word;user-select:text');
  log.textContent = 'Waiting for messages. Book a test appointment above.';
  bar.appendChild(title); bar.appendChild(copy);
  panel.appendChild(bar); panel.appendChild(log);
  document.body.appendChild(panel);
  document.body.style.paddingBottom = '45vh';

  window.addEventListener('message', function (e) {
    var data;
    try { data = typeof e.data === 'string' ? e.data : JSON.stringify(e.data, null, 2); }
    catch (err) { data = '[unserializable: ' + err.message + ']'; }
    lines.push('#' + (lines.length + 1) + '  ' + new Date().toISOString() + '  origin=' + e.origin + '\n' + data);
    title.textContent = 'Diagnostic: ' + lines.length + ' message(s) from the calendar';
    log.textContent = lines.join('\n\n');
    log.scrollTop = log.scrollHeight;
  });

  copy.addEventListener('click', function () {
    var text = lines.join('\n\n');
    var done = function () { copy.textContent = 'Copied'; setTimeout(function () { copy.textContent = 'Copy all'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy:', text); });
    else window.prompt('Copy:', text);
  });
})();
</script>
</body>
</html>
